# Describes 2nd Violins Effects for FastSampler's About tab. Converted from 2nd Violins Effects.gig.
author: "Sonic Implants"
company: "Sonic Network, Inc."
date: "2002"
image: "../../Images/Sonic Temple.jpg"
library: "Symphonic String Collection"
tags:
  - "Strings"
  - "Violin"
  - "Effects"
description: |
  Use the keyswitches (C0-F1) to pick the effect. Each effect starts on C3.
  C0: Behind bridge random
  C#0: Behind bridge tremolo
  D0: Behind bridge short
  D#0: Harmonic glissando random
  E0: Harmonic glissando together
  F0: Harmonic glissando tremolo
  F#0: Short glissando
  G0: Short scratch
  G#0: Short scratch glissando
  A0: Long scratch glissando
  A#0: Long scratch tremolo
  B0: Knocking short
  C1: Knocking long
  C#1: Cluster long
  D1: Cluster fast high
  D#1: Cluster fast low
  E1: Wide vibrato slow
  F1: Wide vibrato high fast

  Played by 6 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
