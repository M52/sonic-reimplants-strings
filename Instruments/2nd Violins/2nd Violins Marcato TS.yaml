description: |
  Accented notes with a strong attack. Volume depends on note-on velocity. 3x round robins vary repeated notes. Samples are shortened or lengthened depending on how long a note is held down, making quick playing sound crisper.

  Played by 6 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
