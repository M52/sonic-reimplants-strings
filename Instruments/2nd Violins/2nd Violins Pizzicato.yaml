description: |
  Plucked notes. Velocity controls the dynamic. From velocity 110 up you hear snap (Bartok) pizzicato. Round robins vary repeated notes. When CC19 is at 64 or higher, the open strings samples play. Below 64, the fingered samples play instead.

  Played by 6 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
