description: |
  Staccato, marcato and spiccato played together for a short, aggressive stroke with a strong bite. Velocity controls the dynamic. Round robins vary repeated notes. The note length stretches the staccato: short notes play it shorter, long notes longer.

  Played by 6 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
