description: |
  Long notes with a natural vibrato, recorded in up and down bows. Velocity 0-63 plays the up bow and 64-127 the down bow. The mod wheel (CC1) crossfades through the dynamic layers: 3 on the down bow and 2 on the up bow. When CC19 is at 64 or higher, the open strings samples play. Below 64, the fingered samples play instead.

  Played by 5 cellos. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
