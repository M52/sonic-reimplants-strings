# Describes Cellos Effects for FastSampler's About tab. Converted from Cellos Effects.gig.
author: "Sonic Implants"
company: "Sonic Network, Inc."
date: "2002"
image: "../../Images/Sonic Temple.jpg"
library: "Symphonic String Collection"
tags:
  - "Strings"
  - "Cello"
  - "Effects"
description: |
  Use the keyswitches (C0-C1) to pick the effect. Each effect starts on C3.
  C0: Behind bridge random
  C#0: Behind bridge long
  D0: Behind bridge tremolo
  D#0: Behind bridge short
  E0: Finger tones
  F0: Harmonics random
  F#0: Harmonics together
  G0: Harmonics tremolo
  G#0: Knocking long
  A0: Knocking short
  A#0: Long scratch
  B0: Short scratch
  C1: Bowed tailpiece

  Played by 5 cellos. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
