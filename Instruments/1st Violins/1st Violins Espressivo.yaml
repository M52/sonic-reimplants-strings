description: |
  Romantic, expressive sustains with more prominent and emotive vibrato. Use CC1 to crossfade between the 3 dynamic layers.

  Played by 8 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
