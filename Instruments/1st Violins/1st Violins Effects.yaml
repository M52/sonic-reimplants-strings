description: |
  Use the keyswitches (C0-A0) to pick the effect. Each effect starts on C3.
  C0: Behind bridge random
  C#0: Behind bridge short
  D0: Behind bridge tremolo
  D#0: Bowed on bridge
  E0: Harmonic glissando
  F0: Short scratch glissando
  F#0: Long scratch
  G0: Long scratch glissando
  G#0: Short scratch tremolo
  A0: Long scratch tremolo

  Played by 8 violins. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
