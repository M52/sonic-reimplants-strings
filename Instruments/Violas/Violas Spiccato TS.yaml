description: |
  Short, bounced notes that alternate down and up bows. Velocity controls the dynamic. 4x round robins vary repeated notes. Samples are shortened or lengthened depending on how long a note is held down, making quick playing sound crisper.

  Played by 6 violas. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
