description: |
  Tremolo played close to the bridge, thin and glassy. The mod wheel (CC1) crossfades through the 3 dynamic layers. When CC19 is at 64 or higher, the open strings samples play. Below 64, the fingered samples play instead.

  Played by 6 violas. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
