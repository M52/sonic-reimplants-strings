date: "2002"
image: "../../Images/Sonic Temple.jpg"
library: "Symphonic String Collection"
tags:
  - "Strings"
  - "Viola"
  - "Effects"
description: |
  Use the keyswitches (C0-D#1) to pick the effect. Each effect starts on C3.
  C0: Behind bridge random
  C#0: Behind bridge tremolo
  D0: Behind bridge short
  D#0: Fast glissando
  E0: Fast glissando tremolo
  F0: Harmonics random
  F#0: Harmonics together
  G0: Harmonics tremolo
  G#0: Long scratch
  A0: Short scratch
  A#0: Short scratch glissando
  B0: Bowed tailpiece
  C1: Cluster
  C#1: Wide vibrato
  D1: Random long pizzicato
  D#1: Random short pizzicato

  Played by 6 violas. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
