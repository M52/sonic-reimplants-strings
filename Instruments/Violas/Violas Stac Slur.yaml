description: |
  Staccato and marcato played together, after Hollywood Strings' Stac Slur. Overlapping notes connect. Velocity controls the dynamic. Round robins vary repeated notes. The note length stretches the stroke: short notes play it shorter, long notes longer.

  Played by 6 violas. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
