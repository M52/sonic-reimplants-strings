# Describes Basses Runs for FastSampler's About tab. Built from Basses Staccato and Basses Half-Step Trills.
author: "Sonic Implants"
company: "Sonic Network, Inc."
date: "2002"
image: "../../Images/Sonic Temple.jpg"
library: "Symphonic String Collection"
tags:
  - "Strings"
  - "Staccato"
  - "Trill"
  - "Runs"
description: |
  Simulates blurry fast runs or fast arpeggiating figures by blending staccato and half-step trill samples. CC1 controls the volume of the half-step trills while velocity controls how much of the staccato transient is heard. Play fast overlapping notes and use the velocity for accents in the run.

  Played by 4 basses. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
