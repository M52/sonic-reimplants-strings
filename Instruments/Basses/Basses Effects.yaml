# Describes Basses Effects for FastSampler's About tab. Converted from Basses Effects.gig.
author: "Sonic Implants"
company: "Sonic Network, Inc."
date: "2002"
image: "../../Images/Sonic Temple.jpg"
library: "Symphonic String Collection"
tags:
  - "Strings"
  - "Double bass"
  - "Effects"
description: |
  Use the keyswitches (C0-F0) to pick the effect. Each effect starts on C3.
  C0: Behind bridge random
  C#0: Behind bridge tremolo
  D0: Harmonic glissando descending
  D#0: Harmonic glissando random
  E0: Short scratch
  F0: Long scratch

  Played by 4 basses. Recorded at Sonic Temple Studios in Roslindale, Massachusetts using players from the Boston Pops and Boston Ballet Orchestra. Recorded in situ. Re-programmed for Sonic Reimplants.
